name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build, and 3.9 is still
    # the minimum the project supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # report every Python version, even if one fails
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pyflakes pytest

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Tests
        run: python -m pytest -q
